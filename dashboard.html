<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Reservation System · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard-wrapper">
  <header class="dashboard-header">
    <div class="header-left">
      <i class="fas fa-flask"></i>
      <span>Lab Reservation System</span>
    </div>
    <div class="header-right">
      <span id="user-name"></span>
      <span id="role-badge" class="role-badge"></span>
      <button id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </header>

  <!-- ===================== STUDENT / LECTURER SECTION ===================== -->
  <section id="student-section" style="display:none;">
    <h2>Book a Lab</h2>
    <div class="card">
      <div class="form-row">
        <div class="input-group">
          <label for="lab-select">Lab</label>
          <select id="lab-select"></select>
          <label class="filter-checkbox">
            <input type="checkbox" id="filter-available-only">
            Only show labs with open slots
          </label>
        </div>
        <div class="input-group">
          <label for="date-select">Date</label>
          <input type="date" id="date-select">
        </div>
      </div>
      <div id="slot-grid" class="slot-grid"></div>

      <form id="reservation-form" style="display:none;">
        <input type="hidden" id="selected-slot">
        <div class="input-group">
          <label for="purpose">Purpose</label>
          <textarea id="purpose" required placeholder="e.g. Group project testing"></textarea>
        </div>
        <button type="submit" class="primary-btn"><i class="fas fa-paper-plane"></i> Submit Request</button>
        <div id="booking-error" class="error-message"></div>
      </form>
    </div>

    <div class="section-header">
      <h2>My Reservations</h2>
      <button id="toggle-reservations-btn" class="toggle-btn" title="Show/hide history"><i class="fas fa-eye"></i></button>
    </div>
    <div id="my-reservations" class="list-container"></div>
  </section>

  <!-- ===================== PIC / ADMIN SECTION ===================== -->
  <section id="admin-section" style="display:none;">
    <h2>Pending Requests</h2>
    <div id="pending-requests" class="list-container"></div>

    <h2>Manage Labs</h2>
    <div class="card">
      <form id="add-lab-form" class="form-row">
        <input type="text" id="new-lab-name" placeholder="Lab name (e.g. Lab 3)" required>
        <input type="number" id="new-lab-capacity" placeholder="Capacity" required min="1">
        <button type="submit" class="primary-btn"><i class="fas fa-plus"></i> Add Lab</button>
      </form>
    </div>
    <div id="lab-list" class="list-container"></div>

    <div class="section-header">
      <h2>All Reservations</h2>
      <button id="toggle-all-reservations-btn" class="toggle-btn" title="Show/hide all reservations"><i class="fas fa-eye"></i></button>
    </div>
    <div id="all-reservations" class="list-container"></div>
  </section>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
  import { initBooking } from './booking.js';
  import { initAdmin } from './admin.js';

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'index.html';
      return;
    }

    const userSnap = await getDoc(doc(db, "users", user.uid));
    if (!userSnap.exists()) {
      alert('No profile found for this account. Contact the PIC.');
      window.location.href = 'index.html';
      return;
    }

    const userData = userSnap.data();
    document.getElementById('user-name').textContent = userData.name;
    document.getElementById('role-badge').textContent = userData.role.toUpperCase();

    if (userData.role === 'admin') {
      document.getElementById('admin-section').style.display = 'block';
      initAdmin();
    } else {
      document.getElementById('student-section').style.display = 'block';
      initBooking(user.uid);
    }
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
